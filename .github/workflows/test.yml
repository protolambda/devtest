on: [push, pull_request]
name: Test
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The minimum version of go.mod, and the latest release.
        go-version: [1.25.x, stable]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}
      - name: Fmt
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "Go code is not formatted:"
            gofmt -l .
            exit 1
          else
            echo "Go code is formatted correctly."
          fi
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...
